type Mutation {
  """
  Start a run of a workflow. Requires owner or editor in the workflow's org.
  """
  triggerWorkflowRun(workflow_id: String!, input_json: String): TriggerWorkflowRunOutput!
}

type Mutation {
  """
  Clear a paused approval_gate and resume the run.
  """
  approveStep(step_run_id: String!, note: String): ApproveStepOutput!
}

type Mutation {
  """
  Create or edit a workflow together with its steps and triggers.
  """
  saveWorkflow(workflow: SaveWorkflowInput!): SaveWorkflowOutput!
}

type Mutation {
  """
  Inbound webhook endpoint for external systems. Unauthenticated; authorised by
  the trigger's own bearer token.
  """
  startWorkflowViaWebhook(
    workflow_id: String!
    token: String!
    payload_json: String
  ): TriggerWorkflowRunOutput!
}

input WorkflowStepInput {
  """The author's preferred order. Only a tiebreak: the handler assigns the real
  position from a topological sort of the connections."""
  position: Int!
  """Stable per-workflow node id. Connections reference it, and it is what
  templates read ({{steps.classify.output.text}}). Derived from the name when
  omitted, so a caller that knows nothing about the graph still works."""
  slug: String
  name: String!
  type: String!
  config_json: String
  """Canvas coordinates."""
  ui_x: Float
  ui_y: Float
  """DEPRECATED, replaced by WorkflowEdgeInput.branch_key. Still accepted so a
  caller sending the old linear shape keeps working: the handler synthesises the
  equivalent connections."""
  branch_key: String
}

input WorkflowEdgeInput {
  from_slug: String!
  to_slug: String!
  """'' or null = unconditional. 'true'/'false' = only on that side of the
  source conditional_branch."""
  branch_key: String
}

input WorkflowTriggerInput {
  trigger_type: String!
  config_json: String
  is_enabled: Boolean
}

input SaveWorkflowInput {
  workflow_id: String
  org_id: String!
  name: String!
  description: String
  steps: [WorkflowStepInput!]!
  """Omit, or send [], for a straight-line workflow: a step with no incoming
  connection is a root and always runs."""
  edges: [WorkflowEdgeInput!]
  triggers: [WorkflowTriggerInput!]!
}

type TriggerWorkflowRunOutput {
  run_id: String!
  status: String!
}

type ApproveStepOutput {
  run_id: String!
  step_run_id: String!
  status: String!
}

type SaveWorkflowOutput {
  workflow_id: String!
  webhook_token: String
}
