table:
  name: watched_records
  schema: public
object_relationships:
  - name: org
    using:
      foreign_key_constraint_on: org_id

# --- Event trigger ---------------------------------------------------------
# The database-event trigger type: inserting a row here starts a run of every
# workflow in that row's org with an enabled database_event trigger.
event_triggers:
  - name: watched_records_start_runs
    definition:
      enable_manual: true
      insert:
        columns: "*"
    webhook: "{{ACTION_BASE_URL}}/api/hooks/db-event"
    headers:
      - name: x-foreman-action-secret
        value_from_env: ACTION_SECRET
    retry_conf:
      num_retries: 2
      interval_sec: 10
      timeout_sec: 60

# --- Layer 1 ---------------------------------------------------------------
# The table behind the database-event trigger. owner/editor can insert a row
# (which starts a run with no button click); viewer can only read.
select_permissions:
  - role: owner
    permission:
      columns: &watched_columns
        - id
        - org_id
        - label
        - payload
        - created_by
        - created_at
      filter: &watched_is_owner
        org:
          members:
            user_id:
              _eq: X-Hasura-User-Id
            role:
              _eq: owner
  - role: editor
    permission:
      columns: *watched_columns
      filter: &watched_is_editor
        org:
          members:
            user_id:
              _eq: X-Hasura-User-Id
            role:
              _eq: editor
  - role: viewer
    permission:
      columns: *watched_columns
      filter:
        org:
          members:
            user_id:
              _eq: X-Hasura-User-Id
            role:
              _eq: viewer
insert_permissions:
  - role: owner
    permission:
      check: *watched_is_owner
      set:
        created_by: x-hasura-user-id
      columns: &watched_writable
        - org_id
        - label
        - payload
  - role: editor
    permission:
      check: *watched_is_editor
      set:
        created_by: x-hasura-user-id
      columns: *watched_writable
